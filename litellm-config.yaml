model_list:
  - model_name: cheap-llm
    litellm_params:
      model: perplexity/sonar
      api_key: "os.environ/PERPLEXITY_API_KEY"
      max_tokens: 8192

  - model_name: live-research-llm
    litellm_params:
      model: perplexity/sonar-pro
      api_key: "os.environ/PERPLEXITY_API_KEY"
      max_tokens: 4096

  - model_name: premium-writer-llm
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
      api_key: "os.environ/ANTHROPIC_API_KEY"
      max_tokens: 4096

  - model_name: fallback-writer-llm
    litellm_params:
      model: perplexity/sonar-pro
      api_key: "os.environ/PERPLEXITY_API_KEY"
      max_tokens: 4096

router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  timeout: 60
  fallbacks:
    - premium-writer-llm: ["fallback-writer-llm"]
    - live-research-llm: ["cheap-llm"]
