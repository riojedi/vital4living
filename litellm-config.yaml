model_list:
  - model_name: cheap-llm
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: "os.environ/DEEPSEEK_API_KEY"
      api_base: "https://api.deepseek.com"
      max_tokens: 8192
      temperature: 0.1

  - model_name: live-research-llm
    litellm_params:
      model: perplexity/sonar-pro
      api_key: "os.environ/PERPLEXITY_API_KEY"

  - model_name: premium-writer-llm
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: "os.environ/ANTHROPIC_API_KEY"
      max_tokens: 4096
      temperature: 0.3

  - model_name: fallback-writer-llm
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: "os.environ/DEEPSEEK_API_KEY"
      max_tokens: 4096

router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  timeout: 60
  fallbacks:
    - premium-writer-llm: ["cheap-llm"]
    - live-research-llm: ["cheap-llm"]
