<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinterest Authorization — Vital4Living</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#F7F6F2;--surface:#F9F8F5;--border:#D4D1CA;--text:#28251D;
    --muted:#7A7974;--primary:#01696F;--primary-hover:#0C4E54;--error:#A12C7B;
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:36px;max-width:600px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--primary);font-weight:700;margin:0 0 8px}
  h1{font-size:24px;margin:0 0 10px;line-height:1.2}
  p{color:var(--muted);line-height:1.55;margin:0 0 20px}
  .label{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  .code-box{background:#171614;color:#CDCCCA;border-radius:10px;padding:18px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;
    word-break:break-all;margin:0 0 18px;max-height:240px;overflow:auto;
    border:1px solid #393836}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{background:var(--primary);color:#fff;border:0;border-radius:9px;
    padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:var(--primary-hover)}
  .hint{font-size:13px;color:var(--muted);margin:14px 0 0}
  .err{color:var(--error)}
</style>
</head>
<body>
<div class="card" id="root">
  <p class="eyebrow">Vital4Living</p>
  <h1>Pinterest authorization</h1>
  <p>Reading the authorization code from the URL…</p>
</div>
<script>
  (function(){
    var root = document.getElementById('root');
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    var state = params.get('state');
    function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    if(code){
      root.innerHTML =
        '<p class="eyebrow">Vital4Living</p>'+
        '<h1>Copy your authorization code</h1>'+
        '<p>This code is single-use and expires in a few minutes. Copy it, then run the token-exchange command in your terminal.</p>'+
        '<div class="label">Authorization code</div>'+
        '<div class="code-box" id="c"></div>'+
        '<div class="row"><button id="btn">Copy code</button><span class="hint" id="copied"></span></div>'+
        '<p class="hint">After copying, return to your terminal and run the <code>curl</code> step.</p>';
      document.getElementById('c').textContent = code;
      var btn = document.getElementById('btn');
      btn.onclick = function(){
        try{
          navigator.clipboard.writeText(code).then(function(){
            btn.textContent='Copied!';document.getElementById('copied').textContent='Code copied to clipboard';
          }, function(){ sel(); });
        }catch(e){ sel(); }
      };
      function sel(){
        var r=document.createRange(); r.selectNode(document.getElementById('c'));
        var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent='Selected — long-press to copy';
      }
    } else {
      root.innerHTML =
        '<p class="eyebrow">Vital4Living</p>'+
        '<h1>No code found</h1>'+
        '<p class="err">No authorization code in the URL. Close this window, re-open the Pinterest consent URL, and approve the scopes.</p>';
    }
  })();
</script>
</body>
</html>
